[project]
name = "holdfast"
version = "0.1.0"
description = "Guarded paper-trading agent for Hyperliquid perps. Human approval, scoped MCP tools, offline evals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "mcp>=2.3,<3",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
live = ["hyperliquid-python-sdk>=0.16", "eth-account>=0.13"]
anthropic = ["anthropic>=2.3,<3"]
dev = ["pytest>=8", "ruff>=0.6", "anthropic>=2.3,<3"]

[project.scripts]
holdfast = "hlguard.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
